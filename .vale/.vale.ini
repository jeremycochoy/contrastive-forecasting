# Vale configuration for ASD-STE100 Simplified Technical English.
# Copy this file to the root of a project and set StylesPath to this directory.
StylesPath = styles
MinAlertLevel = warning

[*.md]
BasedOnStyles = ASD-STE100

# Vale reads only the comments and the docstrings of a Python file.
# Code and string literals are not checked.
[*.py]
BasedOnStyles = ASD-STE100
